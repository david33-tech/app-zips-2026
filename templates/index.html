<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>App ZIP 2026</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 40px;
}

.container {
    background: white;
    color: black;
    padding: 30px;
    border-radius: 10px;
    width: 420px;
    margin: auto;
}

button {
    padding: 10px;
    margin-top: 10px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.logout {
    background: red;
    position: absolute;
    top: 20px;
    right: 20px;
}

.info {
    font-size: 14px;
    margin-top: 10px;
    color: #555;
}
</style>
</head>

<body>

<a href="/logout">
    <button class="logout">Salir</button>
</a>

<div class="container">
    <h2>Subir archivos</h2>

    <form action="/procesar" method="post" enctype="multipart/form-data">

        <p><b>Excel:</b></p>
        <input type="file" name="excel" required>

        <p><b>Carpeta de ZIPs:</b></p>
        <!-- 🔥 AQUÍ ESTÁ LA MAGIA -->
        <input type="file" name="zips" webkitdirectory directory multiple required>

        <div class="info">
            Puedes seleccionar una carpeta completa con todos los ZIPs
        </div>

        <br>
        <button type="submit">Procesar</button>

    </form>
</div>

</body>
</html>
