<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
body {
    margin: 0;
    font-family: Segoe UI;
}

/* SPLASH */
#splash {
    position: fixed;
    width: 100%;
    height: 100%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#splash img {
    width: 300px;
}

/* APP OCULTA */
#app {
    display: none;
}

/* TU DISEÑO */
.header {
    background: #020617;
    color: white;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}

body {
    background: #0f172a;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
    <img src="/static/logo.png">
</div>

<!-- APP -->
<div id="app">

<div class="header">
    <div>📊 Integrador USSACP</div>
    <a href="/logout"><button>Salir</button></a>
</div>

<div class="container">

<h2>Extractor de ZIPs → Carpetas</h2>

<form action="/procesar" method="post" enctype="multipart/form-data">

<p>Excel</p>
<input type="file" name="excel" required>

<p>Carpeta ZIPs</p>
<input type="file" name="zips" webkitdirectory directory multiple required>

<br><br>
<button>Procesar</button>

</form>

</div>

</div>

<script>
setTimeout(() => {
    document.getElementById("splash").style.display = "none";
    document.getElementById("app").style.display = "block";
}, 3000); // 3 segundos
</script>

</body>
</html>
